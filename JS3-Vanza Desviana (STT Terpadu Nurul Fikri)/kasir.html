<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kasir</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- Navbar -->
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-gradient-primary shadow">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">Toko Online</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="produk.html">Produk</a></li>
          <li class="nav-item"><a class="nav-link" href="pelanggan.html">Pelanggan</a></li>
          <li class="nav-item"><a class="nav-link active" href="kasir.html">Kasir</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Kasir -->
  <div class="container py-5">
    <h2 class="mb-4 text-primary fw-bold">Kasir</h2>

    <div class="card shadow-sm mb-4">
      <div class="card-header bg-primary text-white">Buat Pesanan</div>
      <div class="card-body">
        <form id="formPesanan" class="row g-3">
          <div class="col-md-4">
            <select id="pilihPelanggan" class="form-select" required>
              <option value="">Pilih Pelanggan</option>
            </select>
          </div>
          <div class="col-md-4">
            <select id="pilihProduk" class="form-select" required>
              <option value="">Pilih Produk</option>
            </select>
          </div>
          <div class="col-md-2">
            <input type="number" id="jumlah" class="form-control" placeholder="Jumlah" required>
          </div>
          <div class="col-md-2 d-grid">
            <button type="submit" class="btn btn-success">Tambah</button>
          </div>
        </form>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="card-header bg-success text-white">Daftar Pesanan</div>
      <div class="card-body">
        <table class="table table-bordered table-striped text-center align-middle">
          <thead class="table-dark">
            <tr>
              <th>Pelanggan</th>
              <th>Produk</th>
              <th>Jumlah</th>
              <th>Total</th>
            </tr>
          </thead>
          <tbody id="tabelPesanan"></tbody>
          <tfoot class="table-light fw-bold">
            <tr>
              <td colspan="3">Grand Total</td>
              <td id="grandTotal">Rp 0</td>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>
  </div>

  <script src="js/kasir.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
