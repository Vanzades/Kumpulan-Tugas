<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manajemen Produk</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-gradient-primary shadow">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">Toko Online</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="produk.html">Produk</a></li>
          <li class="nav-item"><a class="nav-link" href="pelanggan.html">Pelanggan</a></li>
          <li class="nav-item"><a class="nav-link" href="kasir.html">Kasir</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container py-5">
    <h2 class="mb-4 text-primary fw-bold">Manajemen Produk</h2>
    <div class="card shadow-sm mb-4">
      <div class="card-header bg-primary text-white">Tambah Produk</div>
      <div class="card-body">
        <form id="formProduk" class="row g-3">
          <div class="col-md-4">
            <input type="text" id="nama" class="form-control" placeholder="Nama Produk" required>
          </div>
          <div class="col-md-3">
            <input type="number" id="harga" class="form-control" placeholder="Harga" required>
          </div>
          <div class="col-md-3">
            <input type="number" id="stok" class="form-control" placeholder="Stok" required>
          </div>
          <div class="col-md-2 d-grid">
            <button type="submit" class="btn btn-primary">Tambah</button>
          </div>
        </form>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="card-header bg-success text-white">Daftar Produk</div>
      <div class="card-body">
        <table class="table table-bordered table-striped text-center align-middle">
          <thead class="table-dark">
            <tr>
              <th>ID</th>
              <th>Nama</th>
              <th>Harga</th>
              <th>Stok</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="tabelProduk"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="js/produk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
